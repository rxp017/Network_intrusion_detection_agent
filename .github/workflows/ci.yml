name: Verify NIDA
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: ruff check .
      - run: ruff format --check .
      - run: node --check static/dashboard.js
      - run: node --check static/boot.js
      - run: mkdir -p .test-tmp
      - run: python -m pytest -m 'not browser' -q
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -m browser -q
        env:
          NIDA_BROWSER_TESTS: '1'
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nida:ci .
      - name: Smoke-test container startup
        run: |
          docker run --detach --name nida-ci --publish 127.0.0.1:18000:8000 --env LLM_PROVIDER=none nida:ci
          trap 'docker logs nida-ci; docker stop nida-ci' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18000/health > health.json; then
              python -c "import json; data=json.load(open('health.json')); assert data['status']=='ok' and data['replay_available'] is True"
              exit 0
            fi
            sleep 2
          done
          exit 1
