[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["browser: real Chromium end-to-end tests (opt in with NIDA_BROWSER_TESTS=1)"]


[tool.ruff]
target-version = "py311"
line-length = 110
exclude = [".venv", ".playwright", "data", "artifacts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Body", "fastapi.Query"]
